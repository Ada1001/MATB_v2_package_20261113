<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MATB Monitor Console</title>
  <style>
    :root { --bg:#060d17; --panel:#0d1c2e; --panel2:#122943; --line:rgba(138,190,225,.2); --text:#dcefff; --muted:#7f9bb5; --cyan:#39d5ff; --green:#59efad; --yellow:#ffd166; --red:#ff6b7b; --purple:#b58cff; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    body { padding:18px; }
    .app { max-width:1500px; margin:auto; }
    .topbar { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(120deg,#0c2037,#081522); box-shadow:0 18px 48px rgba(0,0,0,.3); }
    .brand { display:flex; gap:12px; align-items:center; }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:11px; color:#00131b; background:linear-gradient(135deg,var(--cyan),var(--green)); font-weight:900; }
    h1 { margin:0; font-size:16px; letter-spacing:.14em; text-transform:uppercase; }
    .sub { margin-top:3px; color:var(--muted); font-size:11px; letter-spacing:.08em; }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .status i { width:9px; height:9px; border-radius:50%; background:var(--yellow); box-shadow:0 0 10px currentColor; }
    .status.live i { background:var(--green); }
    .clock { min-width:96px; text-align:right; color:#fff; font-size:22px; font-variant-numeric:tabular-nums; }
    .grid { display:grid; grid-template-columns:1.1fr 1fr; gap:14px; margin-top:14px; }
    .panel { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:linear-gradient(145deg,var(--panel),#091827); box-shadow:0 18px 48px rgba(0,0,0,.26); }
    .head { display:flex; justify-content:space-between; align-items:center; padding:11px 13px; border-bottom:1px solid rgba(138,190,225,.13); }
    .title { font-size:11px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    .hint { color:var(--muted); font-size:10px; }
    .body { padding:13px; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .metric { padding:10px; border:1px solid rgba(138,190,225,.16); border-radius:10px; background:rgba(8,23,39,.78); }
    .metric span { color:var(--muted); font-size:10px; }
    .metric strong { display:block; margin-top:3px; color:#fff; font-size:21px; font-variant-numeric:tabular-nums; }
    .loadbar { height:9px; margin-top:9px; overflow:hidden; border-radius:99px; background:rgba(126,155,180,.18); }
    .loadbar i { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--green),var(--yellow),var(--red)); transition:width .2s ease; }
    .loadlabel { display:flex; justify-content:space-between; margin-top:4px; color:var(--muted); font-size:10px; }
    .task-list { display:grid; gap:7px; }
    .task-row { display:grid; grid-template-columns:105px 1fr auto; align-items:center; gap:9px; padding:8px 9px; border:1px solid rgba(138,190,225,.14); border-radius:9px; background:rgba(9,24,40,.72); }
    .task-row.auto-control { border:1px dashed var(--green); box-shadow:0 0 16px rgba(89,239,173,.2); }
    .task-row b { font-size:11px; }
    .task-row span { color:var(--muted); font-size:10px; }
    .task-row em { color:var(--green); font-style:normal; font-size:10px; }
    .task-row.alert em { color:var(--red); }
    .task-row.disabled { opacity:.52; }
    .task-row.disabled em { color:var(--muted); }
    .event-log { max-height:330px; overflow:auto; display:grid; gap:5px; }
    .event { display:grid; grid-template-columns:54px 1fr auto; gap:6px; align-items:center; padding:6px 7px; border-radius:7px; background:rgba(17,37,58,.7); font-size:10px; }
    .event time { color:var(--muted); font-variant-numeric:tabular-nums; }
    .event b { color:var(--text); }
    .event em { color:var(--green); font-style:normal; }
    .event.bad em { color:var(--red); }
    .empty { padding:26px 8px; color:var(--muted); text-align:center; font-size:11px; }
    .eeg { min-height:235px; position:relative; overflow:hidden; border:1px solid rgba(181,140,255,.25); border-radius:10px; background:linear-gradient(145deg,rgba(41,27,72,.45),rgba(8,22,39,.8)); }
    .eeg-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(181,140,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(181,140,255,.08) 1px,transparent 1px); background-size:38px 28px; }
    .eeg-line { position:absolute; inset:0; width:100%; height:100%; }
    .eeg-center { position:absolute; inset:50% 0 auto; border-top:1px dashed rgba(181,140,255,.4); }
    .eeg-label { position:absolute; left:10px; top:8px; color:#d8caff; font-size:10px; letter-spacing:.12em; }
    .eeg-status { position:absolute; right:10px; top:8px; color:var(--muted); font-size:10px; }
    .footnote { margin-top:9px; color:var(--muted); font-size:10px; line-height:1.5; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } .metrics { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">Σ</div><div><h1>MATB · Monitor Console</h1><div class="sub">副屏 / 实时指标 · 事件记录 · EEG</div></div></div>
      <div class="status" id="connection"><i></i><span>等待主屏连接</span></div>
      <div class="clock" id="clock">00:00</div>
    </header>

    <section class="panel" style="margin-top:14px">
      <div class="head"><div class="title">实时指标</div><div class="hint" id="trialLabel">试次：—</div></div>
      <div class="body">
        <div class="metrics">
          <div class="metric"><span>综合正确率</span><strong id="accuracy">—</strong></div>
          <div class="metric"><span>平均反应时</span><strong id="rt">—</strong></div>
          <div class="metric"><span>任务事件</span><strong id="events">0</strong></div>
          <div class="metric"><span>同步标记</span><strong id="markers">0</strong></div>
        </div>
        <div class="hint" style="margin-top:12px">实时负荷指数</div>
        <div class="loadbar"><i id="load"></i></div>
        <div class="loadlabel"><span>低</span><strong id="loadText">待机</strong><span>高</span></div>
      </div>
    </section>

    <section class="grid">
      <div class="panel"><div class="head"><div class="title">任务状态</div><div class="hint">主屏同步</div></div><div class="body"><div class="task-list" id="taskList"><div class="empty">等待主屏发送任务状态…</div></div></div></div>
      <div class="panel"><div class="head"><div class="title">事件记录</div><div class="hint">相对时间 / 反应时</div></div><div class="body"><div class="event-log" id="eventLog"><div class="empty">等待事件…</div></div></div></div>
    </section>

    <section class="panel" style="margin-top:14px"><div class="head"><div class="title">EEG / 波形预览</div></div><div class="body"><div class="eeg"><div class="eeg-grid"></div><canvas class="eeg-line" id="eegCanvas" width="1200" height="300"></canvas><div class="eeg-center"></div><div class="eeg-label">EEG CHANNELS · PREVIEW</div><div class="eeg-status" id="eegStatus">未连接</div></div><div class="footnote">当前页面只显示占位波形和通道状态。主屏发送 <code>{ type: "eeg", payload: { channels, samples, status } }</code> 时，可替换为真实数据。</div></div></section>
  </main>
  <script src="MATB_Monitor_v2.js"></script>
  <script src="online_agmnet/demo_monitor.js"></script>
  <script src="online_agmnet/demo_local_monitor.js"></script>
</body>
</html>
